<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina · VEXOcar</title>
<meta name="theme-color" content="#0E0F11">
<link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/app.css">
<style>
  .capa-ofi { position: relative; aspect-ratio: 16 / 9; border-radius: var(--r-g); overflow: hidden; background: var(--grafite3); }
  .capa-ofi img { width: 100%; height: 100%; object-fit: cover; }
  @media (min-width: 960px) { .capa-ofi { aspect-ratio: 21 / 8; } }
  .capa-ofi::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(14, 15, 17, .9) 0%, transparent 60%); }
  .capa-ofi .sobre { position: absolute; left: 20px; right: 20px; bottom: 18px; z-index: 1; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .capa-ofi h2 { font-family: var(--titulo); font-weight: 400; font-size: 26px; line-height: 1.15; }
  .nota-g { text-align: right; flex: none; }
  .nota-g strong { font-size: 26px; font-variant-numeric: tabular-nums; }
  .nota-g strong span { color: var(--ambar); }
  .info-lin { display: flex; gap: 10px; align-items: flex-start; color: var(--off2); }
  .info-lin + .info-lin { margin-top: 12px; }
  .info-lin svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--cinza); }
  .mini-mapa { height: 220px; border-radius: var(--r-g); overflow: hidden; border: 1px solid var(--linha); background: var(--grafite2); }
  .leaflet-container { background: #1b1d21; font-family: var(--texto); }
  .leaflet-tile-pane { filter: brightness(1.1); }
  .leaflet-control-attribution { background: rgba(14, 15, 17, .8) !important; color: var(--cinza) !important; font-size: 10px; }
  .leaflet-control-attribution a { color: var(--off2) !important; }
  .pin { width: 34px; height: 34px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); display: grid; place-items: center; background: var(--grafite); border: 2px solid var(--verde); box-shadow: 0 6px 16px rgba(0, 0, 0, .5); }
  .pin > * { transform: rotate(45deg); }
  .pin svg { width: 16px; height: 15px; }
  .avaliacao + .avaliacao { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--linha); }
  .avaliacao .cab { display: flex; justify-content: space-between; gap: 12px; }
  .estrelas { color: var(--ambar); letter-spacing: 2px; font-size: 13px; }
  .resumo-av { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .resumo-av .media { text-align: center; min-width: 96px; }
  .resumo-av .media strong { display: block; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
  .resumo-av .barras { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 6px; }
  .barra-av { display: grid; grid-template-columns: 26px 1fr 40px; gap: 10px; align-items: center; font-size: 12px; color: var(--cinza); font-variant-numeric: tabular-nums; }
  .barra-av .trilho { height: 8px; border-radius: 4px; background: var(--grafite3); overflow: hidden; }
  .barra-av .trilho i { display: block; height: 100%; border-radius: 4px; background: #4A4E56; }
  .barra-av.maior .trilho i { background: var(--verde); }
  .barra-av span:last-child { text-align: right; }
  .avaliacao.minha { background: var(--verde-fundo); border: 1px solid rgba(47, 212, 122, .3); border-radius: 14px; padding: 12px 14px; }
  .avaliacao.minha + .avaliacao { border-top: 0; }
  .avaliacao .acoes-av { display: flex; gap: 14px; margin-top: 8px; }
  .avaliacao .acoes-av button { font-size: 13px; font-weight: 600; color: var(--verde); }
  .avaliacao .acoes-av button.apagar { color: var(--erro); }
  .estrelas-in { display: flex; gap: 6px; margin: 6px 0 4px; }
  .estrelas-in button { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 26px; color: var(--linha); background: var(--grafite); border: 1px solid var(--linha); transition: color var(--t), border-color var(--t), transform var(--t); }
  .estrelas-in button.on { color: var(--ambar); border-color: rgba(245, 165, 36, .45); }
  .estrelas-in button:hover { transform: translateY(-2px); }
  .contador { font-size: 12px; color: var(--cinza); text-align: right; }
  .janela .chips .chip { height: 32px; font-size: 13px; }
</style>
</head>
<!-- Tela 19 do wireframe: Perfil público da oficina (o que o motorista vê ao tocar numa oficina do mapa). -->
<body class="shell">
<main class="conteudo entra">
  <header class="topo">
    <a class="voltar" href="oficinas.html" aria-label="Voltar para oficinas" data-icone="voltar"></a>
    <h1 id="titulo" class="so-pc">Oficina</h1>
    <div class="acoes-topo"><button class="ico-btn" id="fav" type="button" aria-label="Favoritar oficina" aria-pressed="false"></button></div>
  </header>

  <div id="conteudo"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/dados.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  VX.shell('oficinas');
  var d = VX.db(), esc = VX.esc, fmt = VX.fmt;
  var o = d.oficinas.filter(function (x) { return x.id === VX.param('id'); })[0] || d.oficinas[0];
  var eu = { lat: -25.4284, lng: -49.2733 };

  function distancia(a, b) {
    var R = 6371, rad = Math.PI / 180;
    var dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
    var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function aberta() { var a = new Date(), h = a.getHours() + a.getMinutes() / 60; return a.getDay() !== 0 && h >= 8 && h < o.fecha; }
  function fecha() { var h = Math.floor(o.fecha), m = Math.round((o.fecha - h) * 60); return h + 'h' + (m ? pad(m) : ''); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  var km = distancia(eu, o);
  var dist = km < 1 ? Math.round(km * 1000) + ' m' : km.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' km';
  var meusAqui = d.manutencoes.filter(function (m) { return m.oficinaId === o.id; });
  var ab = aberta();


  document.title = o.nome + ' · VEXOcar';
  document.getElementById('titulo').textContent = o.nome;
  document.getElementById('conteudo').innerHTML =
    '<div class="capa-ofi"><img src="' + esc(o.foto) + '" alt="Foto da oficina ' + esc(o.nome) + '">' +
      '<div class="sobre"><div><h2>' + esc(o.nome) + '</h2><p class="peq" style="color:var(--off2)">' + esc(o.especialidade) + ' · ' + dist + '</p></div>' +
      '<div class="nota-g" id="nota-g"></div></div></div>' +

    '<div class="duas-col" style="margin-top:16px">' +
      '<section>' +
        '<div class="cartao">' +
          '<div class="info-lin">' + VX.icone('oficinas') + '<span>' + esc(o.endereco) + ' · Curitiba</span></div>' +
          '<div class="info-lin">' + VX.icone('relogio') + '<span>' + esc(o.horario) + '<br>' +
            (ab ? '<span class="tag tag-v">Aberta agora · fecha às ' + fecha() + '</span>' : '<span class="tag">Fechada agora</span>') + '</span></div>' +
        '</div>' +

        '<div class="secao-t"><h2>Serviços</h2></div>' +
        '<div class="chips quebra">' + o.servicos.map(function (s) { return '<span class="chip" style="pointer-events:none">' + esc(s) + '</span>'; }).join('') + '</div>' +

        '<div class="fila-btn" style="margin-top:20px">' +
          '<a class="btn btn-p" target="_blank" rel="noopener" href="' + VX.whats(o.whatsapp, 'Olá! Encontrei vocês na VEXOcar e queria um orçamento para o meu carro.') + '">' + VX.icone('whatsapp') + 'Chamar no WhatsApp</a>' +
          '<a class="btn btn-s" target="_blank" rel="noopener" href="https://www.openstreetmap.org/directions?route=' + eu.lat + '%2C' + eu.lng + '%3B' + o.lat + '%2C' + o.lng + '#map=15/' + o.lat + '/' + o.lng + '">' + VX.icone('rota') + 'Como chegar</a>' +
        '</div>' +

        '<div class="secao-t"><h2>Avaliações</h2><button class="btn btn-s btn-peq" id="btn-avaliar" type="button"></button></div>' +
        '<div id="avaliacoes"></div>' +
      '</section>' +

      '<aside class="fixo">' +
        '<div class="mini-mapa" id="mini-mapa"></div>' +
        '<div class="cartao" style="margin-top:14px">' +
          '<span class="rotulo">Seus serviços aqui</span>' +
          '<div class="kpi" style="margin-top:6px"><strong>' + meusAqui.length + '</strong><small>' + (meusAqui.length === 1 ? 'serviço registrado' : 'serviços registrados') + ' no seu histórico</small></div>' +
          '<p class="peq mudo" style="margin-top:10px">Fez um serviço aqui? Registre com a foto da nota fiscal para ele entrar como comprovado.</p>' +
          '<a class="btn btn-s btn-bloco" style="margin-top:12px" href="nova-manutencao.html">' + VX.icone('mais') + 'Registrar manutenção</a>' +
        '</div>' +
      '</aside>' +
    '</div>';

  // Mini mapa (fixo, sem arrastar)
  if (window.L) {
    var m = L.map('mini-mapa', { zoomControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false, boxZoom: false, keyboard: false })
      .setView([o.lat, o.lng], 15);
    // Mapa escuro da Esri: funciona aberto direto do computador (file://); OpenStreetMap e CARTO bloqueiam esse caso.
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16, attribution: 'Mapa &copy; Esri, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
    }).addTo(m);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(m);
    L.marker([o.lat, o.lng], { icon: L.divIcon({ className: '', iconSize: [34, 34], iconAnchor: [4, 34],
      html: '<div class="pin"><svg viewBox="18 20 84 80"><polygon points="18,20 37,20 60,78 60,100 50,100" fill="#F2F1EC"/><polygon points="83,20 102,20 70,100 60,100 60,78" fill="#2FD47A"/></svg></div>' }) }).addTo(m);
  } else {
    document.getElementById('mini-mapa').innerHTML = '<div class="centro mudo peq" style="padding:90px 16px">Mapa indisponível sem internet</div>';
  }

  // Favoritar (só visual nesta etapa)
  var fav = document.getElementById('fav');
  fav.innerHTML = VX.icone('coracao');
  fav.addEventListener('click', function () {
    var on = fav.getAttribute('aria-pressed') !== 'true';
    fav.setAttribute('aria-pressed', on);
    fav.classList.toggle('ativo', on);
    VX.toast(on ? 'Oficina salva nos favoritos.' : 'Oficina removida dos favoritos.');
  });

  // ---------- Avaliações dos usuários ----------
  var ESTRELAS = '★★★★★';
  function estrelasTxt(n) { return ESTRELAS.slice(0, n) + '<span style="color:var(--linha)">' + ESTRELAS.slice(n) + '</span>'; }
  /* Distribuição: base antiga estimada a partir da média (mantém a média) + avaliações listadas. */
  function distribuicao() {
    var m = o.nota, k = 5 - m, r3 = .05 * k, r2 = .02 * k, r1 = .01 * k, R = 1 - r3 - r2 - r1;
    var a5 = Math.max(0, Math.min(R, m - 4 * R - 3 * r3 - 2 * r2 - r1));
    var n = o.avaliacoes;
    var cont = { 5: Math.round(a5 * n), 4: Math.round((R - a5) * n), 3: Math.round(r3 * n), 2: Math.round(r2 * n), 1: Math.round(r1 * n) };
    VX.avaliacoesDa(d, o.id).forEach(function (v) { cont[v.nota]++; });
    return cont;
  }
  function desenharAvaliacoes() {
    var no = VX.notaOficina(d, o), minha = VX.minhaAvaliacao(d, o.id);
    document.getElementById('nota-g').innerHTML = '<strong><span>★</span> ' + no.media.toLocaleString('pt-BR') + '</strong><br><span class="peq mudo">' + no.total + ' avaliações</span>';
    var b = document.getElementById('btn-avaliar');
    b.innerHTML = VX.icone(minha ? 'editar' : 'estrela') + (minha ? 'Editar minha avaliação' : 'Avaliar esta oficina');
    var cont = distribuicao(), maior = 5;
    [4, 3, 2, 1].forEach(function (n) { if (cont[n] > cont[maior]) maior = n; });
    var tot = [1, 2, 3, 4, 5].reduce(function (s, n) { return s + cont[n]; }, 0) || 1;
    var html = '<div class="cartao"><div class="resumo-av"><div class="media"><strong>' + no.media.toLocaleString('pt-BR') + '</strong>' +
      '<div class="estrelas" aria-hidden="true">' + estrelasTxt(Math.round(no.media)) + '</div><span class="mudo peq">' + no.total + ' avaliações</span></div>' +
      '<div class="barras" role="img" aria-label="Distribuição das notas de 5 a 1 estrela">' + [5, 4, 3, 2, 1].map(function (n) {
        var pct = Math.round(cont[n] / tot * 100);
        return '<div class="barra-av' + (n === maior ? ' maior' : '') + '"><span>' + n + '★</span><div class="trilho"><i style="width:' + pct + '%"></i></div><span>' + pct + '%</span></div>';
      }).join('') + '</div></div></div>';
    var lista = no.lista;
    html += '<div class="cartao" style="margin-top:12px">' + (lista.length ? lista.map(function (v) {
      return '<div class="avaliacao' + (v.minha ? ' minha' : '') + '"><div class="cab"><strong class="peq">' + esc(v.autor) + (v.minha ? ' <span class="tag tag-v">Você</span>' : '') + '</strong>' +
        '<span class="mudo peq">' + fmt.mesAno(v.data) + '</span></div>' +
        '<div class="estrelas" aria-label="' + v.nota + ' de 5 estrelas">' + estrelasTxt(v.nota) + '</div>' +
        (v.servico ? '<span class="tag" style="margin-top:6px">' + esc(VX.NOME_TIPO[v.servico] || v.servico) + '</span>' : '') +
        (v.texto ? '<p class="peq" style="color:var(--off2);margin-top:6px">' + esc(v.texto) + '</p>' : '') +
        (v.minha ? '<div class="acoes-av"><button type="button" data-av="editar">Editar</button><button type="button" class="apagar" data-av="apagar">Apagar</button></div>' : '') + '</div>';
    }).join('') : '<p class="mudo peq">Ninguém avaliou pelo app ainda. Seja o primeiro.</p>') + '</div>';
    document.getElementById('avaliacoes').innerHTML = html;
  }

  function janelaAvaliar() {
    var minha = VX.minhaAvaliacao(d, o.id), nota = minha ? minha.nota : 0, serv = minha ? (minha.servico || '') : '';
    var f = document.createElement('div');
    f.className = 'janela-fundo';
    f.innerHTML = '<form class="janela" role="dialog" aria-modal="true" aria-labelledby="jt" novalidate>' +
      '<h2 id="jt">' + (minha ? 'Editar avaliação' : 'Avaliar ' + esc(o.nome)) + '</h2><p>Sua nota ajuda outros motoristas a escolher.</p>' +
      '<div class="rotulo-campo peq" id="rot-est">Sua nota</div>' +
      '<div class="estrelas-in" role="radiogroup" aria-labelledby="rot-est">' + [1, 2, 3, 4, 5].map(function (n) {
        return '<button type="button" role="radio" data-n="' + n + '" aria-label="' + n + ' de 5" aria-checked="' + (n === nota) + '">★</button>';
      }).join('') + '</div><p class="peq mudo" id="nota-txt-av" style="margin:0 0 14px"></p>' +
      '<div class="rotulo-campo peq" style="margin-bottom:6px">Serviço que você fez (opcional)</div>' +
      '<div class="chips quebra" id="serv-av">' + Object.keys(VX.NOME_TIPO).map(function (t) {
        return '<button type="button" class="chip" data-s="' + t + '" aria-pressed="' + (t === serv) + '">' + VX.NOME_TIPO[t] + '</button>';
      }).join('') + '</div>' +
      '<div class="campo" style="margin:14px 0 4px"><label for="txt-av">Comentário (opcional)</label><textarea id="txt-av" maxlength="280" placeholder="Como foi o atendimento, o prazo e o preço?">' + esc(minha ? minha.texto : '') + '</textarea></div>' +
      '<div class="contador" id="cont-av"></div>' +
      '<div class="fila-btn" style="margin-top:14px"><button type="button" class="btn btn-s" data-r="0">Cancelar</button><button type="submit" class="btn btn-p" id="salvar-av">Salvar avaliação</button></div></form>';
    document.body.appendChild(f);
    requestAnimationFrame(function () { f.classList.add('aberta'); });
    var form = f.querySelector('form'), txt = f.querySelector('#txt-av');
    var FRASE = ['', 'Muito ruim', 'Ruim', 'Ok', 'Boa', 'Excelente'];
    function pintar() {
      f.querySelectorAll('.estrelas-in button').forEach(function (b) {
        var n = +b.dataset.n; b.classList.toggle('on', n <= nota); b.setAttribute('aria-checked', n === nota);
      });
      f.querySelector('#nota-txt-av').textContent = nota ? nota + ' de 5 · ' + FRASE[nota] : 'Toque nas estrelas para dar a nota.';
      f.querySelector('#salvar-av').disabled = !nota;
      f.querySelector('#cont-av').textContent = txt.value.length + '/280';
    }
    pintar();
    (f.querySelector('.estrelas-in button[aria-checked="true"]') || f.querySelector('.estrelas-in button')).focus();
    function fecha() { f.classList.remove('aberta'); setTimeout(function () { f.remove(); }, 200); }
    f.addEventListener('click', function (e) {
      if (e.target === f || e.target.closest('[data-r="0"]')) return fecha();
      var est = e.target.closest('[data-n]'); if (est) { nota = +est.dataset.n; pintar(); return; }
      var ch = e.target.closest('[data-s]');
      if (ch) { serv = serv === ch.dataset.s ? '' : ch.dataset.s; f.querySelectorAll('[data-s]').forEach(function (c) { c.setAttribute('aria-pressed', c.dataset.s === serv); }); }
    });
    f.querySelector('.estrelas-in').addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      e.preventDefault(); nota = Math.max(1, Math.min(5, (nota || 0) + (e.key === 'ArrowRight' ? 1 : -1))); pintar();
      f.querySelector('[data-n="' + nota + '"]').focus();
    });
    txt.addEventListener('input', pintar);
    document.addEventListener('keydown', function tecla(e) { if (e.key === 'Escape') { document.removeEventListener('keydown', tecla); fecha(); } });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!nota) return;
      var u = d.usuario.nome.split(' ').filter(Boolean);
      var autor = u[0] + (u.length > 1 ? ' ' + u[u.length - 1][0] + '.' : '');
      d.avaliacoes = d.avaliacoes || [];
      if (minha) { minha.nota = nota; minha.servico = serv; minha.texto = txt.value.trim(); minha.data = VX.isoData(VX.hoje()); }
      else d.avaliacoes.push({ id: VX.novoId('v'), oficinaId: o.id, autor: autor, nota: nota, servico: serv, texto: txt.value.trim(), data: VX.isoData(VX.hoje()), minha: true });
      VX.salvar(d); fecha(); desenharAvaliacoes();
      VX.toast(minha ? 'Avaliação atualizada.' : 'Obrigado! Sua avaliação foi publicada.');
    });
  }
  document.getElementById('btn-avaliar').addEventListener('click', janelaAvaliar);
  document.getElementById('avaliacoes').addEventListener('click', function (e) {
    var b = e.target.closest('[data-av]'); if (!b) return;
    if (b.dataset.av === 'editar') return janelaAvaliar();
    VX.confirmar('Apagar sua avaliação?', 'Ela sai da lista e da média da oficina.', 'Apagar', true).then(function (ok) {
      if (!ok) return;
      d.avaliacoes = d.avaliacoes.filter(function (v) { return !(v.oficinaId === o.id && v.minha); });
      VX.salvar(d); desenharAvaliacoes(); VX.toast('Avaliação apagada.');
    });
  });
  desenharAvaliacoes();
  if (VX.param('avaliar') === '1') setTimeout(janelaAvaliar, 300);
</script>
</body>
</html>
