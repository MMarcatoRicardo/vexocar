<style>
  :root { --grafite:#0E0F11; --grafite2:#1A1C20; --linha:#2A2D33; --off:#F2F1EC; --verde:#2FD47A; --ambar:#F5A524; --cinza:#8A8F98; --suave:cubic-bezier(.2,.7,.2,1); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:var(--grafite); color:var(--off); font-family:Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  a { color:inherit; text-decoration:none; }
  :focus-visible { outline:2px solid var(--verde); outline-offset:3px; border-radius:4px; }

  /* estrada em perspectiva ao fundo */
  .estrada { position:fixed; inset:auto 0 0; height:62vh; perspective:420px; overflow:hidden; pointer-events:none; }
  .asfalto { position:absolute; left:50%; bottom:-10%; width:72vw; min-width:520px; height:220%; transform:translateX(-50%) rotateX(72deg); transform-origin:bottom;
    background:linear-gradient(90deg, transparent 0 2%, rgba(242,241,236,.55) 2% 2.6%, transparent 2.6% 97.4%, rgba(242,241,236,.55) 97.4% 98%, transparent 98%), linear-gradient(180deg, transparent, #16181c 30%); }
  .faixa { position:absolute; left:50%; top:0; bottom:0; width:1.6%; transform:translateX(-50%);
    background:repeating-linear-gradient(180deg, var(--verde) 0 60px, transparent 60px 120px); animation:anda 1.1s linear infinite; }
  @keyframes anda { from { background-position-y:0; } to { background-position-y:120px; } }
  .neblina { position:fixed; inset:0; background:linear-gradient(180deg, var(--grafite) 38%, rgba(14,15,17,.55) 62%, transparent 100%), radial-gradient(ellipse at 50% 100%, transparent 30%, rgba(14,15,17,.85) 75%); pointer-events:none; }

  .topo { position:fixed; inset:0 0 auto; padding:22px clamp(16px,6vw,96px); z-index:2; }
  .wm { font-family:Audiowide, sans-serif; font-size:24px; line-height:1; display:inline-flex; align-items:baseline; }
  .wm svg { width:.724em; height:.71em; margin-right:.03em; }
  .wm span { color:var(--verde); }

  main { position:relative; z-index:1; min-height:100%; text-shadow:0 2px 24px rgba(14,15,17,.9); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:96px 16px 28vh; }
  .kicker { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--ambar); font-weight:600; display:inline-flex; align-items:center; gap:10px; }
  .kicker i { width:8px; height:8px; border-radius:50%; background:var(--ambar); animation:pulso 2s infinite; }
  @keyframes pulso { 0% { box-shadow:0 0 0 0 rgba(245,165,36,.6); } 70%,100% { box-shadow:0 0 0 9px rgba(245,165,36,0); } }
  .num { font-family:Audiowide, sans-serif; font-size:clamp(110px, 24vw, 260px); line-height:1; margin:14px 0 6px; letter-spacing:-.02em;
    background:linear-gradient(180deg, var(--off) 30%, rgba(242,241,236,.25)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .num { text-shadow:none; }
  .num b { color:var(--verde); -webkit-text-fill-color:var(--verde); font-weight:400; display:inline-block; animation:derrapa 3.2s var(--suave) infinite; }
  @keyframes derrapa { 0%,70%,100% { transform:none; } 78% { transform:translateX(10px) rotate(8deg); } 86% { transform:translateX(-6px) rotate(-5deg); } 92% { transform:translateX(2px) rotate(1deg); } }
  h1 { font-family:Audiowide, sans-serif; font-weight:400; font-size:clamp(26px, 4vw, 40px); line-height:1.15; }
  p.lead { color:rgba(242,241,236,.75); font-size:17px; max-width:480px; margin-top:14px; line-height:1.5; }
  .acoes { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:34px; }
  .btn { display:inline-flex; align-items:center; gap:10px; height:52px; padding:0 28px; border-radius:999px; font-weight:600; font-size:16px; transition:background .2s, box-shadow .2s, transform .2s var(--suave), border-color .2s; }
  .btn-p { background:var(--verde); color:var(--grafite); }
  .btn-p:hover { background:#4BE08F; box-shadow:0 8px 32px rgba(47,212,122,.35); transform:translateY(-2px); }
  .btn-s { border:1px solid rgba(242,241,236,.35); }
  .btn-s:hover { border-color:var(--off); background:rgba(242,241,236,.06); }
  .endereco { margin-top:26px; font-size:13px; color:var(--cinza); max-width:90vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .endereco code { font-family:ui-monospace, Consolas, monospace; color:rgba(242,241,236,.6); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>

<body>
<div class="estrada" aria-hidden="true"><div class="asfalto"><div class="faixa"></div></div></div>
<div class="neblina" aria-hidden="true"></div>

<header class="topo">
  <a class="wm" data-link="index.html" href="index.html" aria-label="VEXOcar, início"><svg viewBox="18 20 84 80" aria-hidden="true"><polygon points="18,20 37,20 60,78 60,100 50,100" fill="#F2F1EC"/><polygon points="83,20 102,20 70,100 60,100 60,78" fill="#2FD47A"/><line x1="91.6" y1="23" x2="66.2" y2="97" stroke="#0E0F11" stroke-width="2.8" stroke-dasharray="8 6"/></svg>EXO<span>car</span></a>
</header>

<main>
  <p class="kicker"><i></i>Erro 404</p>
  <div class="num" aria-hidden="true">4<b>0</b>4</div>
  <h1>Essa página saiu da pista.</h1>
  <p class="lead">O endereço que você abriu não existe ou mudou de lugar. Volte para a estrada principal e siga viagem.</p>
  <div class="acoes">
    <a class="btn btn-p" data-link="index.html" href="index.html">Voltar ao início <span aria-hidden="true">→</span></a>
    <a class="btn btn-s" data-link="index.html#vitrine" href="index.html#vitrine">Conhecer a vitrine</a>
  </div>
  <p class="endereco">Endereço procurado: <code id="end"></code></p>
</main>

<script>
  // Mostra o endereço que falhou e acerta os links para a raiz do site,
  // já que esta página pode abrir em qualquer pasta (ex.: /vexocar/app/nada.html).
  (function () {
    var end = document.getElementById('end');
    end.textContent = decodeURI(location.pathname + location.search);
    var base = '/';
    if (/\.github\.io$/.test(location.hostname)) {
      var parte = location.pathname.split('/')[1];
      if (parte) base = '/' + parte + '/';          // site de projeto: usuario.github.io/vexocar/
    } else if (location.protocol === 'file:') {
      end.parentNode.hidden = true;                 // no computador o caminho não interessa
      base = location.href.replace(/[^/]*$/, '');   // aberto direto do computador: mesma pasta
    }
    document.querySelectorAll('[data-link]').forEach(function (a) { a.href = base + a.dataset.link; });
  })();
</script>
</body>
