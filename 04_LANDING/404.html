<!-- Página 404 do VEXOcar. O GitHub Pages mostra este arquivo sozinho para qualquer endereço que não existe.
     Tudo fica dentro deste arquivo (CSS, ícone e o joguinho), porque ela pode abrir em qualquer pasta do site.
     A estrada do fundo vira um jogo de faixas: setas (ou toque nos lados) para desviar dos obstáculos. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='118' fill='%230E0F11'/%3E%3Cg transform='translate(105 112) scale(3.6)'%3E%3Cg transform='translate(-18 -20)'%3E%3Cpolygon points='18,20 37,20 60,78 60,100 50,100' fill='%23F2F1EC'/%3E%3Cpolygon points='83,20 102,20 70,100 60,100 60,78' fill='%232FD47A'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --grafite:#0E0F11; --grafite2:#1A1C20; --linha:#2A2D33; --off:#F2F1EC; --verde:#2FD47A; --ambar:#F5A524; --cinza:#8A8F98; --suave:cubic-bezier(.2,.7,.2,1); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--grafite); color:var(--off); font-family:Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased;
    overflow:hidden; overscroll-behavior:none; touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  a { color:inherit; text-decoration:none; }
  :focus-visible { outline:2px solid var(--verde); outline-offset:3px; border-radius:4px; }

  #jogo { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  .topo { position:fixed; inset:0 0 auto; padding:22px clamp(16px,6vw,96px); z-index:3; display:flex; align-items:center; justify-content:space-between; pointer-events:none; }
  .topo a { pointer-events:auto; }
  .wm { font-family:Audiowide, sans-serif; font-size:24px; line-height:1; display:inline-flex; align-items:baseline; }
  .wm svg { width:.724em; height:.71em; margin-right:.03em; }
  .wm span { color:var(--verde); }

  /* placar durante a corrida */
  .hud { text-align:right; opacity:0; transform:translateY(-6px); transition:opacity .3s, transform .3s var(--suave); }
  .hud b { display:block; font-family:Audiowide, sans-serif; font-weight:400; font-size:clamp(22px, 4vw, 32px); line-height:1; font-variant-numeric:tabular-nums; }
  .hud small { display:block; margin-top:6px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--cinza); }
  body.jogando .hud { opacity:1; transform:none; }

  main { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:clamp(72px, 11vh, 120px) 16px 0; text-shadow:0 2px 24px rgba(14,15,17,.9); transition:opacity .35s, transform .35s var(--suave); }
  body.jogando main { opacity:0; transform:translateY(-14px); pointer-events:none; }
  .kicker { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--ambar); font-weight:600; display:inline-flex; align-items:center; gap:10px; }
  .kicker i { width:8px; height:8px; border-radius:50%; background:var(--ambar); animation:pulso 2s infinite; }
  @keyframes pulso { 0% { box-shadow:0 0 0 0 rgba(245,165,36,.6); } 70%,100% { box-shadow:0 0 0 9px rgba(245,165,36,0); } }
  .num { font-family:Audiowide, sans-serif; font-size:clamp(64px, min(20vw, 15vh), 190px); line-height:1; margin:10px 0 4px; letter-spacing:-.02em; text-shadow:none;
    background:linear-gradient(180deg, var(--off) 30%, rgba(242,241,236,.25)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .num b { color:var(--verde); -webkit-text-fill-color:var(--verde); font-weight:400; display:inline-block; animation:derrapa 3.2s var(--suave) infinite; }
  @keyframes derrapa { 0%,70%,100% { transform:none; } 78% { transform:translateX(10px) rotate(8deg); } 86% { transform:translateX(-6px) rotate(-5deg); } 92% { transform:translateX(2px) rotate(1deg); } }
  h1 { font-family:Audiowide, sans-serif; font-weight:400; font-size:clamp(24px, 4vw, 38px); line-height:1.15; }
  p.lead { color:rgba(242,241,236,.78); font-size:clamp(15px, 2.2vw, 17px); max-width:480px; margin-top:10px; line-height:1.5; }
  .placar { margin-top:12px; font-size:15px; color:var(--off); }
  .placar strong { color:var(--verde); font-weight:600; }
  .placar[hidden] { display:none; }
  .acoes { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:22px; }
  .btn { display:inline-flex; align-items:center; gap:10px; height:50px; padding:0 26px; border-radius:999px; font-weight:600; font-size:16px; text-shadow:none;
    transition:background .2s, box-shadow .2s, transform .2s var(--suave), border-color .2s; }
  .btn-p { background:var(--verde); color:var(--grafite); }
  .btn-p:hover { background:#4BE08F; box-shadow:0 8px 32px rgba(47,212,122,.35); transform:translateY(-2px); }
  .btn-s { border:1px solid rgba(242,241,236,.35); background:rgba(14,15,17,.5); }
  .btn-s:hover { border-color:var(--off); background:rgba(242,241,236,.06); }
  .dica { margin-top:20px; font-size:14px; color:rgba(242,241,236,.8); display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; }
  .dica .sep { color:var(--cinza); }
  .dica kbd { font-family:Inter, sans-serif; font-size:13px; font-weight:600; min-width:28px; height:26px; padding:0 7px; display:inline-grid; place-items:center;
    border:1px solid rgba(242,241,236,.4); border-bottom-width:3px; border-radius:6px; color:var(--off); text-shadow:none; }
  .dica .pisca { color:var(--verde); font-weight:600; animation:respira 1.8s ease-in-out infinite; }
  @keyframes respira { 50% { opacity:.45; } }
  .endereco { margin-top:12px; font-size:12px; color:var(--cinza); max-width:90vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .endereco code { font-family:ui-monospace, Consolas, monospace; color:rgba(242,241,236,.6); }
  .sr { position:fixed; top:0; left:0; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  @media (max-width:520px) { .dica { flex-direction:column; gap:4px; } .dica .sep { display:none; } }
  @media (max-width:420px) {
    .btn { height:46px; padding:0 18px; font-size:15px; }
    .acoes { gap:10px; margin-top:18px; }
    .topo { padding:16px; }
  }
  @media (max-height:740px) { .endereco { display:none; } }
  @media (max-height:560px) {
    main { padding-top:58px; }
    .num, p.lead { display:none; }
    .acoes { margin-top:12px; }
    .dica { margin-top:10px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<canvas id="jogo" aria-hidden="true"></canvas>

<header class="topo">
  <a class="wm" data-link="index.html" href="index.html" aria-label="VEXOcar, início"><svg viewBox="18 20 84 80" aria-hidden="true"><polygon points="18,20 37,20 60,78 60,100 50,100" fill="#F2F1EC"/><polygon points="83,20 102,20 70,100 60,100 60,78" fill="#2FD47A"/><line x1="91.6" y1="23" x2="66.2" y2="97" stroke="#0E0F11" stroke-width="2.8" stroke-dasharray="8 6"/></svg>EXO<span>car</span></a>
  <div class="hud" aria-hidden="true"><b id="metros">0 m</b><small id="hud-recorde"></small></div>
</header>

<main>
  <p class="kicker"><i></i>Erro 404</p>
  <div class="num" aria-hidden="true">4<b>0</b>4</div>
  <h1>Página não encontrada</h1>
  <p class="lead">O endereço que você abriu não existe ou mudou de lugar. Volte ao início ou, já que está aqui, desvie de uns cones.</p>
  <p class="placar" id="placar" hidden></p>
  <div class="acoes">
    <a class="btn btn-p" data-link="index.html" href="index.html">Voltar ao início <span aria-hidden="true">→</span></a>
    <a class="btn btn-s" data-link="app/demo.html" href="app/demo.html">Ver a demonstração</a>
  </div>
  <p class="dica" id="dica"></p>
  <p class="endereco">Endereço procurado: <code id="end"></code></p>
</main>
<p class="sr" id="aviso" aria-live="polite"></p>

<script>
  // Mostra o endereço que falhou e acerta os links para a raiz do site,
  // já que esta página pode abrir em qualquer pasta (ex.: /vexocar/app/nada.html).
  (function () {
    var end = document.getElementById('end');
    end.textContent = decodeURI(location.pathname + location.search);
    var base = '/';
    if (/\.github\.io$/.test(location.hostname)) {
      var parte = location.pathname.split('/')[1];
      if (parte) base = '/' + parte + '/';          // site de projeto: usuario.github.io/vexocar/
    } else if (location.protocol === 'file:') {
      end.parentNode.hidden = true;                 // no computador o caminho não interessa
      base = location.href.replace(/[^/]*$/, '');   // aberto direto do computador: mesma pasta
    }
    document.querySelectorAll('[data-link]').forEach(function (a) { a.href = base + a.dataset.link; });
  })();

  // ===== Jogo de faixas =====
  // A estrada do fundo tem 3 faixas. Ao apertar uma seta (ou tocar na tela) o texto sai, a câmera sobe e o carro
  // começa a andar. Setas esquerda/direita (ou toque no lado da tela) trocam de faixa. Bateu, volta para a cena.
  // Não tem moeda: o placar é a distância percorrida, e o recorde fica guardado no navegador.
  (function () {
    var cv = document.getElementById('jogo'), ctx = cv.getContext('2d');
    var metros = document.getElementById('metros'), hudRec = document.getElementById('hud-recorde');
    var placar = document.getElementById('placar'), dica = document.getElementById('dica'), aviso = document.getElementById('aviso');
    var COR = { grafite:'#0E0F11', g2:'#1A1C20', linha:'#2A2D33', off:'#F2F1EC', verde:'#2FD47A', ambar:'#F5A524', cinza:'#8A8F98' };
    var REC_KEY = 'vexocar-404-recorde';
    var calmo = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var toque = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    var D = 6, LONGE = 95;                 // D: distância da câmera (perspectiva); LONGE: até onde a estrada é desenhada (m)
    var W, H, cx, base, meia, hor, horParado, horJogo;
    var s = { modo: 'parado', dist: 0, rolar: 0, v: 0, t: 0, faixa: 0, pos: 0, obs: [], ultima: 0, tremor: 0, trava: 0, batida: null, inc: 0 };

    function lerRecorde() { try { return parseInt(localStorage.getItem(REC_KEY), 10) || 0; } catch (e) { return 0; } }
    function salvarRecorde(v) { try { localStorage.setItem(REC_KEY, String(v)); } catch (e) { /* sem armazenamento: tudo bem */ } }
    function fmt(n) { return Math.floor(n).toLocaleString('pt-BR') + ' m'; }
    function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

    function textoDica(fim) {
      var comeco = fim ? 'Bateu! ' : '';
      if (toque) dica.innerHTML = '<span>' + comeco + '<span class="pisca">Toque na estrada para ' + (fim ? 'tentar de novo' : 'dirigir') + '</span></span><span class="sep">·</span><span>os lados da tela trocam de faixa</span>';
      else dica.innerHTML = comeco + '<kbd aria-label="seta esquerda">←</kbd><kbd aria-label="seta direita">→</kbd> <span class="pisca">' + (fim ? 'para tentar de novo' : 'para dirigir') + '</span><span class="sep">·</span><span>desvie dos obstáculos</span>';
    }

    function medir() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx = W / 2;
      D = H > W * 1.2 ? 11 : 6;              // celular em pé: perspectiva mais longa, estrada mais larga
      base = H - Math.max(16, H * 0.045);
      meia = Math.min(W * (D > 6 ? 0.5 : 0.46), 340, H * 0.55);
      // no repouso o horizonte fica logo abaixo do texto; na corrida a câmera sobe
      var fundo = dica.getBoundingClientRect().bottom;
      horParado = Math.min(Math.max(fundo + 14, H * 0.42), H * 0.74);
      horJogo = H * (D > 6 ? 0.3 : 0.36);
      if (hor == null || s.modo === 'parado') hor = horParado;
    }

    // projeção: lx = posição lateral (-1 e 1 são as bordas da estrada), d = metros à frente do carro
    function P(lx, d) { d = Math.max(d, -4.5); var k = D / (D + d); return [cx + lx * meia * k, hor + (base - hor) * k, k]; }
    function quad(a, b, d1, d2, cor) {
      var p1 = P(a, d1), p2 = P(b, d1), p3 = P(b, d2), p4 = P(a, d2);
      ctx.fillStyle = cor; ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.lineTo(p3[0], p3[1]); ctx.lineTo(p4[0], p4[1]); ctx.closePath(); ctx.fill();
    }

    function comecar() {
      if (performance.now() < s.trava) return;
      s.modo = 'jogo'; s.t = 0; s.dist = 0; s.faixa = 0; s.pos = 0; s.obs = []; s.batida = null; s.inc = 0;
      linha(52);
      document.body.classList.add('jogando');
      var r = lerRecorde(); hudRec.textContent = r ? 'recorde ' + fmt(r) : 'primeira corrida';
      aviso.textContent = 'Corrida começou. Use as setas para trocar de faixa.';
    }
    function mover(dx) { s.faixa = Math.max(-1, Math.min(1, s.faixa + dx)); }

    function linha(d) {
      // uma fileira de obstáculos; sempre sobra pelo menos uma faixa livre
      var duas = s.t > 16 && Math.random() < Math.min(0.55, 0.2 + s.t * 0.008);
      var faixas = [-1, 0, 1].sort(function () { return Math.random() - 0.5; }).slice(0, duas ? 2 : 1);
      if (!duas && Math.random() < 0.45) faixas = [s.faixa];      // às vezes mira na faixa do jogador
      var tipos = ['cone', 'cone', 'cavalete', 'buraco', 'parado'];
      faixas.forEach(function (f) { s.obs.push({ d: d, f: f, tipo: tipos[Math.floor(Math.random() * tipos.length)], fase: Math.random() * 6 }); });
      s.ultima = d;
    }

    function bater(o) {
      s.modo = 'batida'; s.batida = o; s.tremor = 0.45;
      var m = Math.floor(s.dist), r = lerRecorde(), novo = m > r;
      if (novo) salvarRecorde(m);
      placar.hidden = false;
      placar.innerHTML = novo ? '<strong>Novo recorde: ' + fmt(m) + '</strong>' : 'Você rodou <strong>' + fmt(m) + '</strong> · recorde ' + fmt(r);
      aviso.textContent = 'Bateu. Você rodou ' + fmt(m) + (novo ? ', novo recorde.' : '.');
      setTimeout(function () {
        s.modo = 'parado'; s.trava = performance.now() + 450;
        document.body.classList.remove('jogando');
        textoDica(true);
      }, 950);
    }

    function atualizar(dt, agora) {
      if (s.modo === 'jogo') { s.t += dt; s.v = Math.min(46, 17 + s.t * 0.85); }
      else if (s.modo === 'batida') s.v = Math.max(0, s.v - dt * 70);
      else s.v += ((calmo ? 0 : 7) - s.v) * Math.min(1, dt * 3);
      var dd = s.v * dt;
      s.dist += dd; s.rolar = (s.rolar + dd) % 4800;
      for (var i = 0; i < s.obs.length; i++) s.obs[i].d -= dd;
      s.obs = s.obs.filter(function (o) { return o.d > -4.2; });
      s.ultima -= dd;
      s.pos += (s.faixa - s.pos) * Math.min(1, dt * 15);
      s.inc += (((s.faixa - s.pos) * 0.12) - s.inc) * Math.min(1, dt * 12);
      if (s.tremor > 0) s.tremor -= dt;
      var alvo = s.modo === 'parado' ? horParado : horJogo;
      hor += (alvo - hor) * Math.min(1, dt * 4);

      if (s.modo !== 'jogo') return;
      var vao = Math.max(17, 31 - s.t * 0.3, s.v * 0.7);      // espaço entre fileiras (m): aperta com o tempo
      if (LONGE - s.ultima >= vao) linha(LONGE);
      for (var j = 0; j < s.obs.length; j++) {
        var o = s.obs[j];
        if (o.d < 1.3 && o.d > -0.7 && Math.abs(o.f - s.pos) < 0.5) { bater(o); break; }
      }
      metros.textContent = fmt(s.dist);
    }

    // ---------- desenho ----------
    function carro(x, y, w, corpo, teto, luz, alerta) {
      var h = w * 0.62;
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.ellipse(x, y, w * 0.58, h * 0.1, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#060607'; rr(x - w * 0.47, y - h * 0.28, w * 0.18, h * 0.28, w * 0.03); ctx.fill(); rr(x + w * 0.29, y - h * 0.28, w * 0.18, h * 0.28, w * 0.03); ctx.fill();
      ctx.fillStyle = teto; ctx.beginPath(); ctx.moveTo(x - w * 0.4, y - h * 0.6); ctx.lineTo(x - w * 0.3, y - h); ctx.lineTo(x + w * 0.3, y - h); ctx.lineTo(x + w * 0.4, y - h * 0.6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#0b0d10'; ctx.beginPath(); ctx.moveTo(x - w * 0.33, y - h * 0.63); ctx.lineTo(x - w * 0.26, y - h * 0.93); ctx.lineTo(x + w * 0.26, y - h * 0.93); ctx.lineTo(x + w * 0.33, y - h * 0.63); ctx.closePath(); ctx.fill();
      ctx.fillStyle = corpo; rr(x - w / 2, y - h * 0.64, w, h * 0.46, w * 0.09); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.28)'; rr(x - w / 2, y - h * 0.3, w, h * 0.12, w * 0.05); ctx.fill();
      ctx.fillStyle = luz; rr(x - w * 0.46, y - h * 0.56, w * 0.2, h * 0.1, w * 0.03); ctx.fill(); rr(x + w * 0.26, y - h * 0.56, w * 0.2, h * 0.1, w * 0.03); ctx.fill();
      if (alerta) { ctx.fillStyle = 'rgba(245,165,36,.25)'; ctx.beginPath(); ctx.arc(x - w * 0.36, y - h * 0.51, w * 0.2, 0, 7); ctx.arc(x + w * 0.36, y - h * 0.51, w * 0.2, 0, 7); ctx.fill(); }
      ctx.fillStyle = COR.off; rr(x - w * 0.12, y - h * 0.47, w * 0.24, h * 0.11, w * 0.015); ctx.fill();
      if (w > 64) { ctx.fillStyle = COR.grafite; ctx.font = '600 ' + Math.round(h * 0.085) + 'px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('404', x, y - h * 0.413); }
    }
    function cone(x, y, k) {
      var w = k * 0.26, h = k * 0.36;
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.ellipse(x, y, w * 0.75, w * 0.16, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#2b2e34'; rr(x - w * 0.6, y - h * 0.08, w * 1.2, h * 0.08, 2); ctx.fill();
      ctx.fillStyle = COR.ambar; ctx.beginPath(); ctx.moveTo(x - w * 0.45, y - h * 0.08); ctx.lineTo(x - w * 0.08, y - h); ctx.lineTo(x + w * 0.08, y - h); ctx.lineTo(x + w * 0.45, y - h * 0.08); ctx.closePath(); ctx.fill();
      ctx.fillStyle = COR.off; ctx.beginPath(); ctx.moveTo(x - w * 0.31, y - h * 0.4); ctx.lineTo(x - w * 0.22, y - h * 0.62); ctx.lineTo(x + w * 0.22, y - h * 0.62); ctx.lineTo(x + w * 0.31, y - h * 0.4); ctx.closePath(); ctx.fill();
    }
    function cavalete(x, y, k) {
      var w = k * 0.8, h = k * 0.34;
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.ellipse(x, y, w * 0.55, h * 0.1, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#9aa0a8'; ctx.fillRect(x - w * 0.4, y - h * 0.8, w * 0.05, h * 0.8); ctx.fillRect(x + w * 0.35, y - h * 0.8, w * 0.05, h * 0.8);
      ctx.save(); rr(x - w / 2, y - h, w, h * 0.42, 3); ctx.clip();
      ctx.fillStyle = COR.off; ctx.fillRect(x - w / 2, y - h, w, h * 0.42);
      ctx.fillStyle = COR.ambar; var passo = w / 6;
      for (var i = -1; i < 7; i++) { var bx = x - w / 2 + i * passo; ctx.beginPath(); ctx.moveTo(bx, y - h * 0.58); ctx.lineTo(bx + passo * 0.5, y - h); ctx.lineTo(bx + passo, y - h); ctx.lineTo(bx + passo * 0.5, y - h * 0.58); ctx.closePath(); ctx.fill(); }
      ctx.restore();
    }
    function buraco(x, y, k) {
      var w = k * 0.66, h = k * 0.15;
      ctx.fillStyle = 'rgba(242,241,236,.12)'; ctx.beginPath(); ctx.ellipse(x, y - h * 0.45, w * 0.5, h * 0.55, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#050506'; ctx.beginPath(); ctx.ellipse(x, y - h * 0.5, w * 0.45, h * 0.45, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = COR.ambar; ctx.lineWidth = Math.max(1, k * 0.012); ctx.setLineDash([k * 0.05, k * 0.04]);
      ctx.beginPath(); ctx.ellipse(x, y - h * 0.47, w * 0.56, h * 0.7, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    }

    function desenhar(agora) {
      ctx.save();
      if (s.tremor > 0) ctx.translate((Math.random() - 0.5) * 12 * s.tremor, (Math.random() - 0.5) * 8 * s.tremor);
      ctx.fillStyle = COR.grafite; ctx.fillRect(-20, -20, W + 40, H + 40);

      // asfalto, zebras, faixas tracejadas e balizas
      quad(-1, 1, -4.5, LONGE, '#1b1d22');
      var off = s.rolar % 8;
      for (var j = 0; j < 27; j++) {
        var d1 = j * 4 - off - 6, d2 = d1 + 4;
        if (d2 < -4.5 || d1 > LONGE) continue;
        var par = j % 2 === 0;
        quad(-1.09, -1, d1, d2, par ? COR.verde : COR.g2);
        quad(1, 1.09, d1, d2, par ? COR.verde : COR.g2);
        if (par) { quad(-1 / 3 - 0.012, -1 / 3 + 0.012, d1, d1 + 2.6, 'rgba(242,241,236,.6)'); quad(1 / 3 - 0.012, 1 / 3 + 0.012, d1, d1 + 2.6, 'rgba(242,241,236,.6)'); }
      }
      var offB = s.rolar % 16;
      for (var b = 0; b < 7; b++) {
        var db = b * 16 - offB + 2;
        if (db < -3 || db > LONGE) continue;
        [-1.3, 1.3].forEach(function (lx) {
          var p = P(lx, db), k = p[2] * meia;
          ctx.fillStyle = '#2c3036'; ctx.fillRect(p[0] - k * 0.012, p[1] - k * 0.22, k * 0.024, k * 0.22);
          ctx.fillStyle = COR.verde; ctx.fillRect(p[0] - k * 0.012, p[1] - k * 0.22, k * 0.024, k * 0.05);
        });
      }

      // obstáculos de longe para perto, com o carro no meio
      var lista = s.obs.slice().sort(function (a, c) { return c.d - a.d; });
      var desenhouCarro = false;
      function oCarro() {
        var lw = meia * 2 / 3, x = cx + s.pos * lw;
        ctx.save(); ctx.translate(x, base); ctx.rotate(s.batida ? 0.18 * Math.sign(s.batida.f - s.pos || 1) : s.inc);
        var freio = s.modo === 'batida' || (s.modo === 'parado' && s.v < 1);
        carro(0, 0, lw * 0.62, COR.verde, '#25b366', freio ? '#ff5a4f' : '#c9362c', false);
        ctx.restore(); desenhouCarro = true;
      }
      lista.forEach(function (o) {
        if (!desenhouCarro && o.d < 0) oCarro();
        var p = P(o.f * 2 / 3, o.d), k = p[2] * meia * 2 / 3;
        ctx.globalAlpha = Math.max(0, Math.min(1, (LONGE - o.d) / 14));
        if (o.tipo === 'cone') { cone(p[0] - k * 0.18, p[1], k); cone(p[0] + k * 0.18, p[1], k); }
        else if (o.tipo === 'cavalete') cavalete(p[0], p[1], k);
        else if (o.tipo === 'buraco') buraco(p[0], p[1], k);
        else { var aceso = Math.floor(agora / 380 + o.fase) % 2 === 0; carro(p[0], p[1], k * 0.66, '#3b3f47', '#30343b', aceso ? COR.ambar : '#5a4420', aceso); }
        ctx.globalAlpha = 1;
      });
      if (!desenhouCarro) oCarro();

      // neblina no horizonte
      var n = ctx.createLinearGradient(0, hor, 0, hor + (base - hor) * 0.22);
      n.addColorStop(0, 'rgba(14,15,17,1)'); n.addColorStop(1, 'rgba(14,15,17,0)');
      ctx.fillStyle = n; ctx.fillRect(-20, hor - 2, W + 40, (base - hor) * 0.22 + 2);
      var brilho = ctx.createRadialGradient(cx, hor, 0, cx, hor, Math.max(W, H) * 0.55);
      brilho.addColorStop(0, 'rgba(47,212,122,.07)'); brilho.addColorStop(1, 'rgba(47,212,122,0)');
      ctx.fillStyle = brilho; ctx.fillRect(-20, -20, W + 40, H + 40);
      ctx.restore();
    }

    var antes = 0;
    function passo(agora) {
      var dt = Math.min(0.05, (agora - (antes || agora)) / 1000); antes = agora;
      atualizar(dt, agora); desenhar(agora);
      requestAnimationFrame(passo);
    }

    addEventListener('keydown', function (e) {
      var k = e.key, esq = k === 'ArrowLeft' || k === 'a' || k === 'A', dir = k === 'ArrowRight' || k === 'd' || k === 'D';
      var vai = k === ' ' || k === 'Spacebar' || k === 'ArrowUp';
      if (s.modo === 'jogo') {
        if (esq || dir) { e.preventDefault(); mover(esq ? -1 : 1); }
        else if (vai || k === 'ArrowDown') e.preventDefault();
        return;
      }
      if (s.modo === 'parado' && (esq || dir || vai)) { e.preventDefault(); comecar(); }
    });
    document.addEventListener('pointerdown', function (e) {
      if (e.target.closest && e.target.closest('a, button')) return;
      if (s.modo === 'parado') comecar();
      else if (s.modo === 'jogo') mover(e.clientX < W / 2 ? -1 : 1);
    });
    addEventListener('resize', medir);

    textoDica(false);
    var r0 = lerRecorde();
    if (r0) { placar.hidden = false; placar.innerHTML = 'Seu recorde: <strong>' + fmt(r0) + '</strong>'; }
    medir();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(medir);
    requestAnimationFrame(passo);
  })();
</script>
